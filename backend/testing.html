<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browser TTS Test</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#111;
    color:white;
    max-width:800px;
    margin:40px auto;
    padding:20px;
}

textarea{
    width:100%;
    height:140px;
    font-size:20px;
    padding:10px;
    border-radius:8px;
    resize:vertical;
}

select{
    width:100%;
    padding:10px;
    margin-top:15px;
    font-size:16px;
}

button{
    padding:12px 25px;
    margin-top:15px;
    font-size:18px;
    cursor:pointer;
    border:none;
    border-radius:8px;
    background:#00b894;
    color:white;
}

button:hover{
    background:#00a383;
}

#status{
    margin-top:20px;
    color:#00ff99;
    font-size:18px;
}

pre{
    background:#222;
    padding:15px;
    border-radius:8px;
    max-height:250px;
    overflow:auto;
    color:#ddd;
}
</style>
</head>
<body>

<h2>Browser Text-To-Speech Test</h2>

<textarea id="text">നമസ്കാരം, സുഖമാണോ? എന്റെ പേര് ആയ്റയാണ്.</textarea>

<select id="voiceSelect"></select>

<br>

<button onclick="speak()">🔊 Speak</button>
<button onclick="stopSpeak()">⏹ Stop</button>

<div id="status"></div>

<h3>Available Voices</h3>
<pre id="voiceList"></pre>

<script>

let voices = [];
const voiceSelect = document.getElementById("voiceSelect");

function loadVoices(){

    voices = speechSynthesis.getVoices();

    voiceSelect.innerHTML = "";

    let output = "";

    voices.forEach((voice,index)=>{

        output += `${index + 1}. ${voice.name} (${voice.lang})\n`;

        const option = document.createElement("option");
        option.value = index;
        option.textContent = `${voice.name} (${voice.lang})`;

        voiceSelect.appendChild(option);

    });

    document.getElementById("voiceList").textContent = output;

}

loadVoices();

if(speechSynthesis.onvoiceschanged !== undefined){
    speechSynthesis.onvoiceschanged = loadVoices;
}

function speak(){

    speechSynthesis.cancel();

    const text = document.getElementById("text").value;

    const utterance = new SpeechSynthesisUtterance(text);

    const voice = voices[voiceSelect.value];

    if(voice){
        utterance.voice = voice;
        utterance.lang = voice.lang;

        document.getElementById("status").innerHTML =
            "<b>Voice:</b> " + voice.name +
            "<br><b>Language:</b> " + voice.lang;
    }

    utterance.rate = 1;
    utterance.pitch = 1;
    utterance.volume = 1;

    speechSynthesis.speak(utterance);

}

function stopSpeak(){
    speechSynthesis.cancel();
}

</script>

</body>
</html>
